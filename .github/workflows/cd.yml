name: CD – Build & Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/yvescape

jobs:
  # ── Étape 1 : détecter quels services ont changé ──────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api-gateway:      ${{ steps.filter.outputs.api-gateway }}
      users-service:    ${{ steps.filter.outputs.users-service }}
      orders-service:   ${{ steps.filter.outputs.orders-service }}
      payments-service: ${{ steps.filter.outputs.payments-service }}
      products-service: ${{ steps.filter.outputs.products-service }}
      review-service:   ${{ steps.filter.outputs.review-service }}
      storefront:       ${{ steps.filter.outputs.storefront }}
      admin:            ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'backend/api-gateway/**'
            users-service:
              - 'backend/users-service/**'
            orders-service:
              - 'backend/orders-service/**'
            payments-service:
              - 'backend/payments-service/**'
            products-service:
              - 'backend/products-service/**'
            review-service:
              - 'backend/review-service/**'
            storefront:
              - 'interface/frontend/e-commerce/**'
            admin:
              - 'interface/admin/**'

  # ── Étape 2 : build + push de chaque image modifiée ──────────────────────
  build-push:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.api-gateway      == 'true' ||
      needs.detect-changes.outputs.users-service    == 'true' ||
      needs.detect-changes.outputs.orders-service   == 'true' ||
      needs.detect-changes.outputs.payments-service == 'true' ||
      needs.detect-changes.outputs.products-service == 'true' ||
      needs.detect-changes.outputs.review-service   == 'true' ||
      needs.detect-changes.outputs.storefront       == 'true' ||
      needs.detect-changes.outputs.admin            == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-gateway
            context: backend/api-gateway
            changed: ${{ needs.detect-changes.outputs.api-gateway }}
          - image: users-service
            context: backend/users-service
            changed: ${{ needs.detect-changes.outputs.users-service }}
          - image: orders-service
            context: backend/orders-service
            changed: ${{ needs.detect-changes.outputs.orders-service }}
          - image: payments-service
            context: backend/payments-service
            changed: ${{ needs.detect-changes.outputs.payments-service }}
          - image: products-service
            context: backend/products-service
            changed: ${{ needs.detect-changes.outputs.products-service }}
          - image: review-service
            context: backend/review-service
            changed: ${{ needs.detect-changes.outputs.review-service }}
          - image: e-commerce
            context: interface/frontend/e-commerce
            changed: ${{ needs.detect-changes.outputs.storefront }}
          - image: admin
            context: interface/admin
            changed: ${{ needs.detect-changes.outputs.admin }}

    steps:
      - uses: actions/checkout@v4
        if: matrix.changed == 'true'

      - name: Set up Docker Buildx
        if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: matrix.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        if: matrix.changed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan image with Trivy
        if: matrix.changed == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

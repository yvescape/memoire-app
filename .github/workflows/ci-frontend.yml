name: CI – Frontend

on:
  push:
    branches: ["**"]
    paths:
      - "interface/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "interface/**"
      - ".github/workflows/ci-frontend.yml"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: storefront
            path: interface/frontend/e-commerce
          - name: admin
            path: interface/admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app.path }}/package-lock.json

      - name: Install
        working-directory: ${{ matrix.app.path }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.app.path }}
        run: npm run lint --if-present

      - name: Build
        working-directory: ${{ matrix.app.path }}
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.app.name }}
          path: ${{ matrix.app.path }}/dist
          retention-days: 7

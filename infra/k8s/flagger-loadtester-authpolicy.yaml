# Le loadtester tourne hors du mesh Linkerd (linkerd.io/inject: disabled)
# pour que Flagger puisse l'appeler en HTTP simple sans mTLS cross-namespace.
# Ce fichier est conservé pour documenter le choix d'architecture.
#
# Namespace memoire-app a linkerd.io/inject: enabled → la désactivation
# est portée par l'annotation du pod template du déploiement flagger-loadtester
# (appliquée via kubectl patch, non géré par ArgoCD).

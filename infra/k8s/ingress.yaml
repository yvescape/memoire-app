apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memoire-app-ingress
  namespace: memoire-app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: app.memoire.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: e-commerce
                port:
                  number: 3000

    - host: admin.memoire.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 3001
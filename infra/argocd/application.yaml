apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: memoire-app
  namespace: argocd
spec:
  destination:
    namespace: memoire-app
    server: https://kubernetes.default.svc
  project: default
  source:
    path: infra/k8s
    repoURL: https://github.com/yvescape/memoire-app
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  ignoreDifferences:
    # Flagger scales the original Deployment to 0 and rewrites Service selectors
    # after creating the -primary counterpart. ArgoCD must not fight these changes.
    - group: apps
      kind: Deployment
      name: users-service
      namespace: memoire-app
      jsonPointers: [/spec/replicas]
    - group: apps
      kind: Deployment
      name: products-service
      namespace: memoire-app
      jsonPointers: [/spec/replicas]
    - group: apps
      kind: Deployment
      name: orders-service
      namespace: memoire-app
      jsonPointers: [/spec/replicas]
    - group: apps
      kind: Deployment
      name: payments-service
      namespace: memoire-app
      jsonPointers: [/spec/replicas]
    - group: apps
      kind: Deployment
      name: review-service
      namespace: memoire-app
      jsonPointers: [/spec/replicas]
    - group: apps
      kind: Deployment
      name: api-gateway
      namespace: memoire-app
      jsonPointers: [/spec/replicas]
    - group: ""
      kind: Service
      name: users-service
      namespace: memoire-app
      jsonPointers: [/spec/selector]
    - group: ""
      kind: Service
      name: products-service
      namespace: memoire-app
      jsonPointers: [/spec/selector]
    - group: ""
      kind: Service
      name: orders-service
      namespace: memoire-app
      jsonPointers: [/spec/selector]
    - group: ""
      kind: Service
      name: payments-service
      namespace: memoire-app
      jsonPointers: [/spec/selector]
    - group: ""
      kind: Service
      name: review-service
      namespace: memoire-app
      jsonPointers: [/spec/selector]
    - group: ""
      kind: Service
      name: api-gateway
      namespace: memoire-app
      jsonPointers: [/spec/selector]
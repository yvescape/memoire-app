apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: memoire-app
  namespace: argocd
spec:
  destination:
    namespace: memoire-app
    server: https://kubernetes.default.svc
  project: default
  source:
    path: infra/k8s
    repoURL: https://github.com/yvescape/memoire-app
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  ignoreDifferences:
    # Flagger scales users-service Deployment to 0 after creating the primary
    - group: apps
      kind: Deployment
      name: users-service
      namespace: memoire-app
      jsonPointers:
        - /spec/replicas
    # Flagger rewrites the selector to point to users-service-primary pods
    - group: ""
      kind: Service
      name: users-service
      namespace: memoire-app
      jsonPointers:
        - /spec/selector